<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link href="chrome://browser/content/extension.css" rel="stylesheet">
  <style>
    body { font-size: 120%; }
    h1 {
      margin-bottom: 0.1em;
      padding-bottom: 4px;
      border-bottom: 1px solid #888;
    }
    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: rgb(40, 40, 40);
        color: rgb(215, 215, 215);
        padding: 0em 2em 2em 2em;
      }
    }
  </style>
</head>

<body>
  <form>
    <h1>Closed Tab List Options</h1>
    <label>Show this many closed tabs in the list <input type="text" id="listSize" size="3"> (Max: 25)</label>
    <br><br>
    
    <h1>Exceeding Firefox Limit of 10</h1>
    You must increase the 'browser.sessionstore.max_tabs_undo' setting manually in 'about:config' if you want to see more than 10 tabs in the list. 
    <br><br>
    
    <button type="submit">Save Options</button>
  </form>
<script src="options.js"></script>
</body>

</html>
